server.port=8765

# Eureka (profil par defaut : execution locale)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Routes Zuul (resolution des services via Eureka)
# http://localhost:8765/order-service/order  ->  order-service  /order
# http://localhost:8765/demo/hello           ->  demo           /hello
zuul.routes.order-service.path=/order-service/**
zuul.routes.order-service.service-id=order-service
zuul.routes.demo.path=/demo/**
zuul.routes.demo.service-id=demo

# Timeouts (evite les erreurs au premier appel, le temps que Ribbon charge les instances)
ribbon.ReadTimeout=10000
ribbon.ConnectTimeout=5000
hystrix.command.default.execution.isolation.thread.timeoutInMilliseconds=20000

# Voir les routes : http://localhost:8765/actuator/routes
management.endpoints.web.exposure.include=health,routes,filters
